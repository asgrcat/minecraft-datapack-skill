name: docs-harness

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  DATAPACK_HARNESS_ROOT: .

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate profiles
        run: python "$DATAPACK_HARNESS_ROOT/tools/datapack_harness.py" profiles
      - name: Run harness tests
        run: >-
          python -m unittest discover
          -s "$DATAPACK_HARNESS_ROOT/tests" -v
