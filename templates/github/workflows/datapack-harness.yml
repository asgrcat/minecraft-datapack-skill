name: datapack-harness

on:
  pull_request:

permissions:
  contents: read

env:
  DATAPACK_HARNESS_ROOT: tools/mc-datapack-harness
  DATAPACK_PROJECT: datapack-project.json

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data pack statically
        run: >-
          python "$DATAPACK_HARNESS_ROOT/tools/datapack_harness.py"
          validate-project --project "$DATAPACK_PROJECT"
