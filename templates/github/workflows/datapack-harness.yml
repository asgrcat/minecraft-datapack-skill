name: datapack-harness

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  DATAPACK_HARNESS_ROOT: tools/mc-datapack-harness
  DATAPACK_PROJECT: datapack-project.json

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check harness profiles
        run: python "$DATAPACK_HARNESS_ROOT/tools/datapack_harness.py" profiles
      - name: Check project configuration
        run: >-
          python "$DATAPACK_HARNESS_ROOT/tools/datapack_harness.py"
          project-check --project "$DATAPACK_PROJECT"
      - name: Validate generated pack statically
        run: >-
          python "$DATAPACK_HARNESS_ROOT/tools/datapack_harness.py"
          validate-project --project "$DATAPACK_PROJECT"
